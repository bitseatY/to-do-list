<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>to do list</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Miniver&family=Poppins:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>To do list</h1>

      <input type="text" id="new-task" placeholder="write task here" />
      <button id="add-btn">Add</button>
      <ul class="task-container" id="task-container"></ul>
      <h3>completed</h3>
      <ul class="completed-tasks" id="completed-container"></ul>
    </div>

    <script src="script.js"></script>
  </body>
</html>
